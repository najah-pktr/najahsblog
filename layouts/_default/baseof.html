<!DOCTYPE html>
<html lang="{{ site.LanguageCode }}">
<head>
  {{ partial "head.meta.html" . }}
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <a href="{{ "/" | relURL }}">najah's blog</a>
      </div>
      <nav>
        {{ range site.Menus.main }}
          <a href="{{ .URL }}">{{ .Name }}</a>
        {{ end }}
      </nav>
    </header>

    <main>
      {{ block "main" . }}{{ end }}
    </main>

    <footer>
      <p>&copy; {{ now.Year }} &bull; Built by Najah with Hugo &amp; Self made CSS</p>
    </footer>
  </div>
</body>
</html>
