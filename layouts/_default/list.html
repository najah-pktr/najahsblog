{{ define "main" }}
<h1>{{ .Title }}</h1>
<ul style="list-style: none; padding: 0; margin-top: 2rem;">
  {{ range .Pages }}
  <li style="margin-bottom: 1.5rem;">
    <span style="color: var(--text-muted); font-size: 0.85rem; display: block;">{{ .Date.Format "2006-01-02" }}</span>
    <a href="{{ .RelPermalink }}" style="font-size: 1.1rem; text-decoration: none;">{{ .Title }}</a>
  </li>
  {{ end }}
</ul>
{{ end }}
