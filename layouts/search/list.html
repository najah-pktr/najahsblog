{{ define "main" }}
<h1 style="font-size: 1.5rem; margin-bottom: 1rem;">search</h1>
<p style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem;">Instant search across all posts and guides.</p>

<!-- Pagefind UI Container -->
<div id="search" style="margin-bottom: 3rem;"></div>

<!-- Import Pagefind Styles & Script -->
<link href="{{ "/pagefind/pagefind-ui.css" | relURL }}" rel="stylesheet">
<script src="{{ "/pagefind/pagefind-ui.js" }}"></script>
<script>
    window.addEventListener('DOMContentLoaded', (event) => {
        new PagefindUI({ 
            element: "#search", 
            showSubResults: true,
            resetStyles: false 
        });
    });
</script>
{{ end }}
